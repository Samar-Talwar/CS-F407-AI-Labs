[project]
name = "cs-f407-ai-labs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "torch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["week01_neural_models", "week02_agents", "week03_search", "week04_logic",
             "week05_transformers_ar", "week06_bayesian_networks_llm",
             "week07_ar_models_handson", "week08_bayesian_networks"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["**/original/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
